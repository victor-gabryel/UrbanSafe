spring.application.name=urbansafe-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbansafe}
spring.datasource.username=${DB_USER:urbansafe}
spring.datasource.password=${DB_PASSWORD:urbansafe_db}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# O Hibernate identifica o dialeto automaticamente pela conexão JDBC.
# Não é necessário configurar hibernate.dialect manualmente.

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600

# Configuração de envio de e-mail pelo Gmail
# Configuração de envio de e-mail pelo Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true