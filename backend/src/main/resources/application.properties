spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbansafe}
spring.datasource.username=${DB_USERNAME:urbansafe}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do e-mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Timeouts evitam que uma requisição fique presa se o SMTP estiver fora do ar (milissegundos).
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}

app.mail.from=${MAIL_FROM}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# JWT — JWT_SECRET é obrigatório (sem valor padrão, de propósito) e deve ter no mínimo 32 bytes.
# Gere com: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:urbansafe-backend}
app.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:60}

# Verificação de e-mail
app.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
# Intervalo mínimo entre dois e-mails de reenvio para a mesma conta.
app.email-verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
# Limite por IP em POST /api/auth/reenviar-verificacao (janela deslizante); excedeu = 429.
app.email-verification.resend-max-per-window=${EMAIL_VERIFICATION_RESEND_MAX_PER_WINDOW:5}
app.email-verification.resend-window-minutes=${EMAIL_VERIFICATION_RESEND_WINDOW_MINUTES:15}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# TRACE em produção vaza detalhes internos da cadeia de segurança; ajuste via variável quando precisar depurar.
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# Swagger / OpenAPI. Em produção, defina SWAGGER_ENABLED=false.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Ocorrências e mapa (PostGIS)
# Tamanho máximo de página em GET /api/ocorrencias.
app.ocorrencias.limite-maximo=${OCORRENCIAS_LIMITE_MAXIMO:100}
# Máximo de marcadores por consulta em GET /api/mapa/ocorrencias.
app.mapa.max-resultados=${MAPA_MAX_RESULTADOS:500}
# Lado máximo (em graus) do bbox aceito nas consultas geográficas.
app.mapa.max-lado-bbox-graus=${MAPA_MAX_LADO_BBOX_GRAUS:5.0}
# Mapa de calor: máximo de células retornadas e intervalo/padrão do tamanho da célula (graus).
app.mapa.calor.max-celulas=${MAPA_CALOR_MAX_CELULAS:2000}
app.mapa.calor.celula-min-graus=${MAPA_CALOR_CELULA_MIN_GRAUS:0.0005}
app.mapa.calor.celula-max-graus=${MAPA_CALOR_CELULA_MAX_GRAUS:0.05}
app.mapa.calor.celula-padrao-graus=${MAPA_CALOR_CELULA_PADRAO_GRAUS:0.005}

# Mídias: armazenamento em disco (trocável implementando ArmazenamentoArquivos) e limites em bytes.
app.storage.local.path=${STORAGE_PATH:./storage}
app.midias.max-por-ocorrencia=${MIDIAS_MAX_POR_OCORRENCIA:10}
app.midias.max-bytes-imagem=${MIDIAS_MAX_BYTES_IMAGEM:10485760}
app.midias.max-bytes-video=${MIDIAS_MAX_BYTES_VIDEO:52428800}
app.midias.max-bytes-audio=${MIDIAS_MAX_BYTES_AUDIO:10485760}
app.midias.max-bytes-documento=${MIDIAS_MAX_BYTES_DOCUMENTO:10485760}
# Teto do container para uploads (deve ser >= ao maior limite por tipo).
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:55MB}
