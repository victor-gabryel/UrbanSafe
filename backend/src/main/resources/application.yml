spring:
    application:
        name: urbansafe-backend

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/urbansafe}
        username: ${DB_USER:urbansafe}
        password: ${DB_PASSWORD:UrbanSafeDev_2026_local}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: never
