services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: urbansafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-urbansafe}
      POSTGRES_USER: ${DB_USER:-urbansafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - urbansafe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  urbansafe_postgres_data:
